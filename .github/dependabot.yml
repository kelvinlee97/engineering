version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "area: tooling"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/youtube-transcript"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "area: youtube"]
    commit-message:
      prefix: "build"
