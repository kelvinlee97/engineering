name: Wiki site

# Builds wiki/ with Quartz (pinned in scripts/build_site.py), checks that
# every page is emitted with no broken internal links, and on main deploys the
# result to GitHub Pages at https://wiki.kelvin.ink/ (the custom domain is set
# in the repository's Pages settings).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Build the site
        run: python scripts/build_site.py build

      - name: Check the build output
        run: python scripts/build_site.py check

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site-build/public

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Render every Mermaid diagram
        run: python3 scripts/check_mermaid_diagrams.py

  gate:
    # The required status check for main (set in branch protection). It always
    # reports; only a failed or cancelled upstream job fails it.
    name: Wiki site gate
    if: always()
    needs: [build, mermaid]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of the jobs above
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          for name in sorted(needs):
              print(f"{name}: {needs[name]['result']}")
          bad = sorted(n for n, v in needs.items() if v["result"] not in ("success", "skipped"))
          if bad:
              print(f"::error::upstream jobs did not pass: {', '.join(bad)}")
              sys.exit(1)
          print("All upstream jobs passed or were skipped.")
          PY

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, mermaid]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test the deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # Assert against site/quartz.config.ts so a rename cannot rot the check.
          expected="$(sed -n 's/^ *pageTitle: "\(.*\)",$/\1/p' site/quartz.config.ts | head -n 1)"
          if [ -z "$expected" ]; then
            echo "::error::Could not read pageTitle from site/quartz.config.ts"
            exit 1
          fi
          echo "Checking $PAGE_URL for page title: $expected"
          # Pages can report success before the CDN serves the new build, and a
          # new custom domain can serve plain HTTP before its certificate is
          # issued, so retry and fall back to HTTP while TLS is not ready.
          for attempt in $(seq 1 20); do
            for url in "$PAGE_URL" "${PAGE_URL/https:/http:}"; do
              if curl -fsSL --max-time 20 "$url" -o /tmp/index.html 2>/dev/null &&
                grep -qF "$expected" /tmp/index.html; then
                echo "Smoke test passed on attempt $attempt via $url"
                exit 0
              fi
            done
            echo "Attempt $attempt: site not serving the new build yet, waiting."
            sleep 15
          done
          echo "::error::Deployed site never served the page title ($expected)"
          exit 1
