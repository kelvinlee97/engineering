name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v2026.09.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              v*) ;;
              *) echo "::error::tag must start with 'v' (got '$INPUT_TAG')"; exit 1 ;;
            esac
            if git rev-parse -q --verify "refs/tags/$INPUT_TAG" >/dev/null; then
              echo "::error::tag $INPUT_TAG already exists"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$INPUT_TAG" -m "Release $INPUT_TAG"
            git push origin "refs/tags/$INPUT_TAG"
            echo "name=$INPUT_TAG" >>"$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >>"$GITHUB_OUTPUT"
          fi

      - name: Generate the changelog
        id: changelog
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          .github/scripts/changelog.sh "$TAG" notes.md
          cat notes.md

      - name: Publish the release
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
