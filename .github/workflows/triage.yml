name: Triage

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - ".github/workflows/triage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triage-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  labels:
    name: Sync label set
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const byName = new Map(existing.map((l) => [l.name, l]));
            for (const label of wanted) {
              const args = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name,
                color: label.color,
                description: label.description || '',
              };
              const current = byName.get(label.name);
              if (!current) {
                await github.rest.issues.createLabel(args);
                core.info(`created ${label.name}`);
              } else if (current.color !== label.color || (current.description || '') !== args.description) {
                await github.rest.issues.updateLabel(args);
                core.info(`updated ${label.name}`);
              }
            }

  issue-triage:
    name: Label and assign new issues
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const { issueLabels } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.js`);
            const issue = context.payload.issue;
            const labels = issueLabels(issue);
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, labels,
            });
            core.info(`labels: ${labels.join(', ')}`);

            // Assign the repository owner so nothing sits unowned.
            if ((issue.assignees || []).length === 0) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, assignees: [context.repo.owner],
                });
              } catch (error) {
                core.warning(`could not assign ${context.repo.owner}: ${error.message}`);
              }
            }

  pr-triage:
    name: Label pull requests
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target checks out the base ref, so the triage module below
      # is always the trusted copy from main, never the PR's version.
      - uses: actions/checkout@v7
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
      - name: Apply a size label
        uses: actions/github-script@v9
        with:
          script: |
            const { sizeLabel, staleSizeLabels } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.js`);
            const pr = context.payload.pull_request;
            const size = sizeLabel(pr.additions, pr.deletions);
            const current = pr.labels.map((l) => l.name);
            for (const stale of staleSizeLabels(current, size)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, name: stale,
              }).catch(() => {});
            }
            if (!current.includes(size)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, labels: [size],
              });
            }
