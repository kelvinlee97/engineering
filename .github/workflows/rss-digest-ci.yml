name: RSS digest module

on:
  pull_request:
    paths:
      - "rss-digest/**"
      - ".github/workflows/rss-digest-ci.yml"
  push:
    branches: [main]
    paths:
      - "rss-digest/**"
      - ".github/workflows/rss-digest-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rss-digest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest
