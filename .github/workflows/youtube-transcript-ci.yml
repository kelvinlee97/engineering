name: YouTube transcript module

on:
  # No path filter on pull_request: this job is a required status check
  # on main, and a required check that never reports leaves unrelated
  # pull requests pending forever. The `filter` step below skips the
  # real work instead, so unrelated pull requests stay cheap.
  pull_request:
  push:
    branches: [main]
    paths:
      - "youtube-transcript/**"
      - ".agents/skills/youtube-transcript/**"
      - "YouTube/**"
      - ".github/workflows/youtube-transcript-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-transcript
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the checks below need to run
        id: filter
        # Pinned to the repo root: this job's defaults.run sets
        # working-directory, and the paths below are repo-relative.
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            # Not a pull request. The other triggers keep their path filter,
            # so reaching here already means the run is relevant.
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "--- changed files ---"
          echo "$changed"
          # Keep this pattern in step with the push path filter above.
          if printf '%s\n' "$changed" | grep -qE '^youtube-transcript/|^\.agents/skills/youtube-transcript/|^YouTube/|^\.github/workflows/youtube-transcript-ci\.yml$'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        if: steps.filter.outputs.run == 'true'
        run: python -m pip install uv
      - name: Install locked dependencies
        if: steps.filter.outputs.run == 'true'
        run: uv sync --frozen --group dev
      - name: Lint
        if: steps.filter.outputs.run == 'true'
        run: uv run ruff check .
      - name: Type-check
        if: steps.filter.outputs.run == 'true'
        run: uv run mypy src
      - name: Test
        if: steps.filter.outputs.run == 'true'
        run: uv run pytest
