name: Knowledge base site

on:
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "mkdocs.yml"
      - "pages/**"
      - "scripts/knowledge_base.py"
      - "scripts/tests/**"
      - ".github/workflows/knowledge-pages.yml"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "**/*.md"
      - "mkdocs.yml"
      - "pages/**"
      - "scripts/knowledge_base.py"
      - "scripts/tests/**"
      - ".github/workflows/knowledge-pages.yml"

permissions:
  contents: read

concurrency:
  group: knowledge-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install site dependencies
        run: python -m pip install -r pages/requirements.txt
      - name: Validate public content
        run: python scripts/knowledge_base.py validate
      - name: Stage public content
        run: python scripts/knowledge_base.py stage --output .pages-build
      - name: Build site
        run: mkdocs build --strict
      - name: Test knowledge-base builder
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
