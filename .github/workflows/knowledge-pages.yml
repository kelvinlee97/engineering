name: Knowledge base site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "mkdocs.yml"
      - "pages/**"
      - "scripts/**"
      - ".github/scripts/**"
      - "pyproject.toml"
      - ".github/workflows/knowledge-pages.yml"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "**/*.md"
      - "mkdocs.yml"
      - "pages/**"
      - "scripts/**"
      - ".github/scripts/**"
      - "pyproject.toml"
      - ".github/workflows/knowledge-pages.yml"

permissions:
  contents: read

concurrency:
  group: knowledge-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install site dependencies
        run: python -m pip install -r pages/requirements.txt
      - name: Install tooling checks
        run: python -m pip install ruff mypy pytest types-PyYAML
      - name: Lint repository tooling
        run: ruff check .
      - name: Type-check repository tooling
        run: mypy
      - name: Validate public content
        run: python scripts/knowledge_base.py validate
      - name: Stage public content
        run: python scripts/knowledge_base.py stage --output .pages-build
      - name: Build site
        run: mkdocs build --strict
      - name: Test knowledge-base builder
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Render every Mermaid diagram
        run: python3 scripts/check_mermaid_diagrams.py

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, mermaid]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test the deployed site
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          curl --retry 10 --retry-delay 15 --retry-all-errors -fsS "$url" -o /tmp/index.html
          echo "--- fetched page (first 20 lines) ---"
          head -n 20 /tmp/index.html
          grep -q "Kelvin" /tmp/index.html || { echo "::error::Deployed page is missing expected site title text"; exit 1; }
          grep -q "ibm-plex-sans-latin-wght-normal.woff2" /tmp/index.html || { echo "::error::Deployed page is not referencing the current font assets — the rebrand may not have propagated"; exit 1; }
          echo "Smoke test passed: $url is live and serving the current build."
