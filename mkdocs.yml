site_name: Engineering Knowledge Base
site_url: https://blog.kelvin.ink/
site_description: Practical, bilingual engineering notes on cloud, infrastructure, developer tooling, and operations.
repo_name: kelvinlee97/engineering
repo_url: https://github.com/kelvinlee97/engineering
docs_dir: .pages-build
site_dir: .pages-site
use_directory_urls: true

theme:
  name: material
  language: en
  custom_dir: pages/overrides
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference

# Chinese tab bar, consumed by pages/overrides/partials/tabs.html. The generated
# nav is English-only (listing both languages doubles every entry), so Chinese
# pages render these instead. `match` lists the top-level directories that make
# a tab the active one. Keep in step with NAV_SECTIONS in
# scripts/knowledge_base.py; a test asserts every url resolves to a staged page.
extra:
  kb_tabs_zh:
    - label: 首页
      url: index_zh/
      match: index_zh
    - label: 故障排查
      url: Git/index_zh/
      match: Git Kubernetes Nginx Nodejs ZooKeeper
    - label: AWS
      url: AWS/index_zh/
      match: AWS
    - label: AI 编程工具
      url: Claude/index_zh/
      match: Claude
    - label: 语言与练习
      url: Python/index_zh/
      match: Python Bash
    - label: 环境配置
      url: Ghostty/index_zh/
      match: Ghostty Ubuntu apple youtube-transcript
    - label: 视频笔记
      url: YouTube/index_zh/
      match: YouTube
    - label: 浏览
      url: topics/index_zh/
      match: topics archive repository
    - label: English
      url: ''
      match: ''

extra_css:
  - stylesheets/knowledge-base.css

plugins:
  - search
  # The nav is generated by `scripts/knowledge_base.py stage` into
  # .pages-build/SUMMARY.md, so that AWS's 123 pages stay grouped by service
  # family instead of flooding an auto-generated alphabetical tree.
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
