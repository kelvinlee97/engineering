site_name: Engineering Knowledge Base
site_url: https://blog.kelvin.ink/
site_description: Practical, bilingual engineering notes on cloud, infrastructure, developer tooling, and operations.
repo_name: kelvinlee97/engineering
repo_url: https://github.com/kelvinlee97/engineering
docs_dir: .pages-build
site_dir: .pages-site
use_directory_urls: true

theme:
  name: material
  language: en
  custom_dir: pages/overrides
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.prune
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference

extra_css:
  - stylesheets/knowledge-base.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
