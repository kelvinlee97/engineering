site_name: Kelvin’s Engineering Notes
site_url: https://blog.kelvin.ink/
site_description: Practical engineering notes on cloud, infrastructure, developer tooling, and operations.
repo_name: kelvinlee97/engineering
repo_url: https://github.com/kelvinlee97/engineering
docs_dir: .pages-build
site_dir: .pages-site
use_directory_urls: true

theme:
  name: material
  language: en
  custom_dir: pages/overrides
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tooltips

# The wordmark in the menu bar. The full `site_name` stays the browser title
# and the SEO title; the bar carries the short form.
extra:
  kb_wordmark: Kelvin’s Notes

extra_css:
  - stylesheets/knowledge-base.css

plugins:
  - search
  # The nav is generated by `scripts/knowledge_base.py stage` into
  # .pages-build/SUMMARY.md, so that AWS's 123 pages stay grouped by service
  # family instead of flooding an auto-generated alphabetical tree.
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
