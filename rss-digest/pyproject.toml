[project]
name = "rss-digest"
version = "0.1.0"
description = "Aggregate configured RSS/Atom feeds into one deduplicated, reviewable Markdown digest."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rss-digest = "rss_digest.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rss_digest"]
